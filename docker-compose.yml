# Un solo comando levanta el agente completo (PRD §8 · Arranque):
#
#     cd reto-01
#     docker compose up --build
#
# Queda en http://127.0.0.1:3000 (front de chat + API). Con Ollama corriendo en
# el host y el modelo descargado, el agente responde de verdad; sin Ollama,
# `LLM_PROVIDER=mock` permite recorrer la app entera con un guion fijo.
#
# Variables: se leen del entorno y, si existe, de `reto-01/.env`
# (`cp solucion/.env.example .env`). `.env` está ignorado por git.

services:
  agente:
    build:
      # El contexto es la raíz del reto: la imagen necesita `solucion/` y
      # `fixtures/` (ver solucion/Dockerfile).
      context: .
      dockerfile: solucion/Dockerfile
    image: reto-01-agente-proveedor
    ports:
      # Puerto del host : puerto del contenedor.
      - "${PORT:-3000}:3000"
    environment:
      # Dentro del contenedor, 127.0.0.1 no es alcanzable desde fuera.
      HOST: 0.0.0.0
      PORT: 3000

      # Proveedor: ollama (local, por defecto) · openai · mock.
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"

      # Ollama corre en el host, no en el contenedor: asi el modelo se comparte
      # con el resto del sistema y no hay que descargar 5 GB dentro de Docker.
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-granite4.1:8b}"
      # El prompt mas los esquemas de las herramientas rondan 4 200 tokens; por
      # debajo de 8192 Ollama rechaza la peticion.
      OLLAMA_NUM_CTX: "${OLLAMA_NUM_CTX:-8192}"

      # Solo si LLM_PROVIDER=openai. La clave NO se versiona: llega por entorno
      # o desde `reto-01/.env` (PRD §8 · Seguridad).
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
    extra_hosts:
      # En Linux `host.docker.internal` no existe por defecto; en macOS y Windows
      # ya está resuelto y esta línea no molesta.
      - "host.docker.internal:host-gateway"
    volumes:
      # Los archivos generados quedan visibles desde el host (`solucion/out/`),
      # que es donde el evaluador mira el xlsx, el paquete y log.jsonl.
      - ./solucion/out:/app/out
    restart: unless-stopped
